name: Lint e Formatacao

on:
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/sport 
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/sport/package-lock.json'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Checar formatacao (Prettier)
        run: npm run format:check

      - name: Checar Lint (ESLint)
        run: npm run lint

  backend-check:
    name: backend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Instalar dependencias do projeto
        run: uv sync

      - name: Checar formatacao (Ruff Format)
        run: uv run ruff format --check .

      - name: Checar Lint (Ruff Check)
        run: uv run ruff check .